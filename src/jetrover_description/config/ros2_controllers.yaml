controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_like_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    eef_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters: {}

ackermann_like_controller:
  ros__parameters:
    # 转向关节顺序：右关节在前，左关节在后
    # 正转向值 → 车辆沿 z 轴正方向（逆时针）转动，即向左转（REP-103）
    steering_joints_names:
      - front_right_steering_joint   # 右转向关节（内轮，转角更大）
      - front_left_steering_joint    # 左转向关节（外轮，转角更小）

    # 驱动关节顺序：右关节在前，左关节在后
    # 右转时：右轮（内轮）速度慢，左轮（外轮）速度快
    traction_joints_names:
      - rear_right_wheel_joint       # 右驱动轮
      - rear_left_wheel_joint        # 左驱动轮

    wheelbase: 0.21327639
    traction_track_width: 0.2094484
    steering_track_width: 0.2094481
    traction_wheels_radius: 0.0505

    odom_frame_id: odom
    base_frame_id: base_link
    publish_rate: 50.0
    open_loop: false
    position_feedback: false
    enable_odom_tf: true

    # 里程计协方差（x, y, z, roll, pitch, yaw）
    pose_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.02, 0.02, 1000000.0, 1000000.0, 1000000.0, 0.05]
    velocity_rolling_window_size: 10 # 速度滑动平均窗口大小

    # false：转向未到位时不降低轮速（可能导致轮胎打滑，但响应更快）
    reduce_wheel_speed_until_steering_reached: false
    reference_timeout: 0.5           # 指令超时时间（s），超时后停车

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

eef_controller: 
  ros__parameters:
    joints:
      - l_joint
      - r_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity