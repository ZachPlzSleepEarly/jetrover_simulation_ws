controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_like_controller:
      type: ackermann_steering_controller/AckermannSteeringController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    eef_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters: {}

ackermann_like_controller:
  ros__parameters:
    # Joints
    # 官方要求两转向、两驱动；双 joint 时顺序期望是 right, left
    steering_joints_names:
      - front_left_steering_joint
      - front_right_steering_joint

    traction_joints_names:
      - rear_left_wheel_joint
      - rear_right_wheel_joint

    # Geometry (unit: meter)，CAD文件测量得到
    wheelbase: 0.21327606
    traction_track_width: 0.20944846
    steering_track_width: 0.20944818
    traction_wheels_radius: 0.101

    # Odometry
    odom_frame_id: odom
    base_frame_id: base_link
    publish_rate: 50.0
    open_loop: false
    position_feedback: false
    enable_odom_tf: true
    pose_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
    twist_covariance_diagonal: [0.0, 7.0, 14.0, 21.0, 28.0, 35.0]
    velocity_rolling_window_size: 10

    # Safety / behavior
    reduce_wheel_speed_until_steering_reached: false
    reference_timeout: 0.5

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

eef_controller:
  ros__parameters:
    joints:
      - l_joint
      - r_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity